<!-- Input Section with Quick Actions -->
<div class="search-container">
  <div class="input-group">
    <input type="text" id="urlInput" placeholder="Enter or paste URL (e.g., https://example.com)..." autofocus autocomplete="off" />
    <button id="pasteBtn" type="button" class="btn-secondary" title="Paste from clipboard">📋 Paste</button>
    <button id="scanBtn" type="button" class="btn-primary">Scan URL</button>
  </div>

  <!-- Quick Test Chips -->
  <div class="quick-chips">
    <span class="chips-label">Quick Test:</span>
    <button type="button" class="chip" data-url="https://www.google.com">Google (Safe)</button>
    <button type="button" class="chip" data-url="https://g00gle.com">Typosquat</button>
    <button type="button" class="chip" data-url="http://192.168.1.1/login">Raw IP</button>
  </div>
</div>

<!-- Compact Metric Bar (To be populated dynamically) -->
<div id="resultsView" class="hidden">
  <div class="verdict-banner" id="verdictBanner">
    <div id="verdictText">Legitimate</div>
    <button id="copyReportBtn" class="btn-outline">Copy Report</button>
  </div>

  <div class="metrics-grid">
    <div class="metric-card">
      <span class="metric-title">Risk Score</span>
      <span class="metric-value" id="riskScoreVal">--%</span>
    </div>
    <div class="metric-card">
      <span class="metric-title">ML Confidence</span>
      <span class="metric-value" id="mlScoreVal">--%</span>
    </div>
    <div class="metric-card">
      <span class="metric-title">VirusTotal</span>
      <span class="metric-value" id="vtVal">--/--</span>
    </div>
    <div class="metric-card">
      <span class="metric-title">Domain Age</span>
      <span class="metric-value" id="ageVal">-- days</span>
    </div>
  </div>
</div>
