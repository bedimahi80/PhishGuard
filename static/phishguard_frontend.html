<body>

<div class="container">
    <header>
        <h1 style="margin: 0;">PHISHGUARD <span style="font-weight: 400; color: #718096;">| Terminal</span></h1>
        <div class="status-chip mono">
            Model Active (Acc: {{ accuracy }}%) | VT: {% if vt_configured %}Enabled{% else %}Disabled{% endif %}
        </div>
    </header>

    <div class="search-console">
        <h2 style="margin-top: 0;">Target URL Scanner</h2>
        <form id="scanForm" class="input-group">
            <input type="url" id="urlInput" placeholder="› https://..." required>
            <button type="submit" id="scanBtn">INITIATE SCAN</button>
        </form>
    </div>

    <div id="resultsArea" class="results-grid">
        
        <!-- ML Verdict (Instant) -->
        <div class="panel col-7">
            <h3>Machine Learning Verdict</h3>
            <div id="mlVerdict" class="verdict-main mono">--</div>
            <p style="text-align: center;">Confidence: <span id="mlConfidence" class="mono">--</span>%</p>
        </div>

        <!-- Signal Breakdown -->
        <div class="panel col-5">
            <h3>Lexical Signals</h3>
            <ul id="signalList" class="signal-list">
                <!-- Injected via JS -->
            </ul>
        </div>

        <!-- Holistic Banner -->
        <div class="panel col-12" id="holisticPanel">
            <h3>Holistic Security Score</h3>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div id="holisticLabel" class="verdict-main mono" style="margin: 0;">WAITING...</div>
                <div style="font-size: 1.5rem;">Risk Score: <span id="holisticScore" class="mono">--</span>/100</div>
            </div>
            <p id="overrides" class="text-phishing" style="font-weight: bold; margin-bottom: 0;"></p>
        </div>

        <!-- Third Party Lookups -->
        <div class="panel col-4" id="vtPanel">
            <h3>VirusTotal</h3>
            <div id="vtContent">Pending...</div>
        </div>

        <div class="panel col-4" id="whoisPanel">
            <h3>WHOIS Data</h3>
            <div id="whoisContent">Pending...</div>
        </div>

        <div class="panel col-4" id="dnsPanel">
            <h3>DNS Resolution</h3>
            <div id="dnsContent">Pending...</div>
        </div>

    </div>
</div>

<script>
    document.getElementById('scanForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const url = document.getElementById('urlInput').value;
        const btn = document.getElementById('scanBtn');
        const resultsArea = document.getElementById('resultsArea');
        
        // Reset UI
        btn.disabled = true;
        btn.innerText = "SCANNING...";
        resultsArea.style.display = 'grid';
        
        // Reset Third Party Panels
        document.getElementById('vtContent').innerText = "Running concurrent scan...";
        document.getElementById('whoisContent').innerText = "Running concurrent scan...";
        document.getElementById('dnsContent').innerText = "Running concurrent scan...";
        document.getElementById('holisticLabel').innerText = "ANALYZING...";
        document.getElementById('holisticLabel').className = "verdict-main mono text-amber";
        document.getElementById('holisticScore').innerText = "--";
        document.getElementById('overrides').innerText = "";
        
        try {
            // 1. FAST PATH: Get ML Verdict
            const mlRes = await fetch('/api/scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });
            const mlData = await mlRes.json();
            
            if (mlData.error) throw new Error(mlData.error);
            
            // Render ML Verdict
            const mlLabelEl = document.getElementById('mlVerdict');
            mlLabelEl.innerText = mlData.label.toUpperCase();
            mlLabelEl.className = 'verdict-main mono ' + (mlData.label === 'phishing' ? 'text-phishing' : 'text-legitimate');
            
            const conf = mlData.label === 'phishing' ? mlData.probability_phishing : mlData.probability_legitimate;
            document.getElementById('mlConfidence').innerText = conf;
            
            // Render Signals
            const signalList = document.getElementById('signalList');
            signalList.innerHTML = '';
            mlData.signals.forEach(sig => {
                const li = document.createElement('li');
                if(sig.risky) li.classList.add('text-amber');
                li.innerHTML = `<span>${sig.label}</span> <span>${sig.value}</span>`;
                signalList.appendChild(li);
            });

            // 2. SLOW PATH: Get Enrichment & Holistic Score
            const enrichRes = await fetch('/api/enrich', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });
            const enrichData = await enrichRes.json();
            
            // Render Holistic Score
            const hol = enrichData.holistic;
            const holLabelEl = document.getElementById('holisticLabel');
            holLabelEl.innerText = hol.label.toUpperCase();
            holLabelEl.className = 'verdict-main mono ' + (hol.label === 'phishing' ? 'text-phishing' : 'text-legitimate');
            document.getElementById('holisticScore').innerText = hol.score;
            
            if (hol.overrides && hol.overrides.length > 0) {
                document.getElementById('overrides').innerText = "⚠️ Override applied: " + hol.overrides.join(" | ");
            }

            // Render VirusTotal
            const vt = enrichData.virustotal;
            if (!vt.available) {
                document.getElementById('vtContent').innerHTML = `<span class="text-amber">Unavailable: ${vt.reason}</span>`;
            } else {
                document.getElementById('vtContent').innerHTML = `
                    Malicious Engines: <strong><span class="${vt.malicious > 0 ? 'text-phishing' : 'text-legitimate'}">${vt.malicious}</span> / ${vt.total_engines}</strong><br>
                    Status: ${vt.status}
                `;
            }

            // Render WHOIS
            const whois = enrichData.whois;
            if (!whois.available) {
                document.getElementById('whoisContent').innerHTML = `<span class="text-amber">Unavailable: ${whois.reason}</span>`;
            } else {
                document.getElementById('whoisContent').innerHTML = `
                    Domain Age: <strong>${whois.domain_age_days ? whois.domain_age_days + ' days' : 'Unknown'}</strong><br>
                    Registrar: ${whois.registrar || 'Unknown'}
                `;
            }

            // Render DNS
            const dns = enrichData.dns;
            if (!dns.available) {
                document.getElementById('dnsContent').innerHTML = `<span class="text-amber">Unavailable: ${dns.reason}</span>`;
            } else {
                document.getElementById('dnsContent').innerHTML = `
                    Resolves to IP: <strong><span class="${dns.resolves ? 'text-legitimate' : 'text-phishing'}">${dns.resolves ? 'Yes' : 'No'}</span></strong>
                `;
            }

        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "INITIATE SCAN";
        }
    });
</script>
</body>
